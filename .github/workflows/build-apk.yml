name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Install dependencies & Prepare www
        run: |
          npm install
          npm run build
      - name: Add Android Platform, Storage Permissions & Build Debug APK
        run: |
          npx cap add android
          python3 - << 'EOF'
          p = "android/app/src/main/AndroidManifest.xml"
          s = open(p, "r", encoding="utf-8").read()
          perms = (
              '    <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" />\n'
              '    <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" />\n'
              '    <uses-permission android:name="android.permission.READ_MEDIA_IMAGES" />'
          )
          if "WRITE_EXTERNAL_STORAGE" not in s:
              s = s.replace("<application", perms + "\n    <application", 1)
          if "requestLegacyExternalStorage" not in s:
              s = s.replace("<application", '<application android:requestLegacyExternalStorage="true"', 1)
          open(p, "w", encoding="utf-8").write(s)
          EOF
          npx cap sync android
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CAD-Survey-2D-Android-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk